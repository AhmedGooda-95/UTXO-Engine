[package]
name = "utxo_engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "utxo_engine"
path = "src/lib.rs"

[[bin]]
name = "utxo_engine"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
ripemd = "0.1"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
hex = { version = "0.4", features = ["serde"] }
bs58 = { version = "0.5", features = ["check"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rand = "0.8"
